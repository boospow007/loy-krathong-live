name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loy-krathong-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - run: bun run build
      - run: bun run build:api
      - name: Package compiled application
        if: github.event_name != 'pull_request'
        run: tar -czf release.tar.gz .output dist/api.mjs deploy/Dockerfile deploy/compose.prod.yaml
      - name: Configure pinned deployment SSH key
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/loy_deploy"
          chmod 600 "$HOME/.ssh/loy_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/loy_known_hosts"
      - name: Configure production runtime
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: loy_krathong_live
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PUBLIC_ORIGIN: https://loy-krathong.168.144.142.139.sslip.io
          COOKIE_SECURE: 'true'
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
        run: |
          set -o pipefail
          python3 deploy/runtime-env.py | ssh -i "$HOME/.ssh/loy_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/loy_known_hosts" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" configure
      - name: Deploy and verify (automatic rollback on health failure)
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i "$HOME/.ssh/loy_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/loy_known_hosts" -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < release.tar.gz
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://loy-krathong.168.144.142.139.sslip.io/api/health
          printf '\n### Production\nhttps://loy-krathong.168.144.142.139.sslip.io\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH key
        if: always()
        run: rm -f "$HOME/.ssh/loy_deploy" "$HOME/.ssh/loy_known_hosts"
