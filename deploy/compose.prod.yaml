name: loy-krathong-live
x-runtime: &runtime
  image: loy-krathong-live:${RELEASE_ID:?release ID required}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
services:
  api:
    <<: *runtime
    command: ['bun', '/app/api.mjs']
    env_file:
      - path: /opt/loy-krathong-live/shared/runtime.env
        format: raw
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '4100'
    mem_limit: 256m
    cpus: 0.35
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4100/api/state').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  web:
    <<: *runtime
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      NUXT_API_INTERNAL_URL: http://api:4100
      TRUST_PROXY: 'true'
    ports:
      - '127.0.0.1:4310:3000'
    mem_limit: 256m
    cpus: 0.35
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/state').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
